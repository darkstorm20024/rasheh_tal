<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رَشّح — منصة التوظيف الذكية</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preload" as="image" href="/rasheh-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-light: #dbeafe;
      --primary-hover: #2563eb;
      --primary-600: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-xl: 0 20px 40px -12px rgba(15, 23, 42, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Cairo', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.7; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* Header */
    header { background: rgba(255,255,255,0.95); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--border); padding: 14px 0; position: sticky; top: 0; z-index: 50; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 145px; height: 64px; object-fit: contain; }
    nav { display: flex; align-items: center; gap: 8px; }
    .nav-link { padding: 10px 18px; border-radius: 10px; font-weight: 600; color: var(--text-muted); transition: all 0.2s; font-size: 0.95rem; background: transparent; border: none; cursor: pointer; font-family: inherit; }
    .nav-link:hover { background: var(--primary-light); color: var(--primary); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 28px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost { background: transparent; color: var(--text); }
    .btn-ghost:hover { background: #f1f5f9; color: var(--primary); }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline:hover { background: var(--primary); color: #fff; }
    .btn-lg { padding: 16px 36px; font-size: 1.05rem; }

    /* Hero */
    .hero { padding: 110px 0 130px; text-align: center; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; top: -60%; left: -60%; width: 220%; height: 220%; background: radial-gradient(ellipse at center, var(--primary-light) 0%, transparent 70%); opacity: 0.6; pointer-events: none; animation: float 20s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(2%, 2%) rotate(1deg); } }
    .hero-inner { position: relative; z-index: 1; }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 20px; margin-bottom: 24px; font-size: 0.9rem; font-weight: 600; color: var(--primary); box-shadow: var(--shadow); animation: fadeUp 0.8s ease-out; }
    .hero-badge svg { width: 16px; height: 16px; }
    .hero h1 { font-size: clamp(2.5rem, 6vw, 4.25rem); font-weight: 900; line-height: 1.1; color: var(--text); margin-bottom: 28px; max-width: 1000px; margin-left: auto; margin-right: auto; letter-spacing: -0.03em; animation: fadeUp 0.8s ease-out 0.1s both; }
    .hero h1 .highlight { background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero p { font-size: clamp(1.15rem, 2.4vw, 1.4rem); color: var(--text-muted); margin-bottom: 44px; max-width: 760px; margin-left: auto; margin-right: auto; font-weight: 400; animation: fadeUp 0.8s ease-out 0.2s both; }
    .hero-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; animation: fadeUp 0.8s ease-out 0.3s both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Features */
    .features { padding: 100px 0; }
    .features-header { text-align: center; margin-bottom: 64px; }
    .features-header .section-tag { display: inline-block; font-size: 0.85rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
    .features-header h2 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 16px; letter-spacing: -0.02em; }
    .features-header p { color: var(--text-muted); font-size: 1.2rem; max-width: 680px; margin: 0 auto; font-weight: 400; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 44px 36px; box-shadow: var(--shadow); transition: transform 0.4s, box-shadow 0.4s, border-color 0.4s; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), #60a5fa); transform: scaleX(0); transform-origin: left; transition: transform 0.4s; }
    .card:hover { transform: translateY(-8px); box-shadow: var(--shadow-xl); border-color: transparent; }
    .card:hover::before { transform: scaleX(1); }
    .card-icon { width: 60px; height: 60px; background: var(--primary-light); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; color: var(--primary); transition: all 0.4s; flex-shrink: 0; }
    .card:hover .card-icon { background: var(--primary); color: #fff; transform: scale(1.08) rotate(2deg); }
    .card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.01em; }
    .card p { color: var(--text-muted); font-size: 1rem; line-height: 1.85; font-weight: 400; }

    /* Stats Bar */
    .stats-bar { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 70px 0; margin-top: 40px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px; text-align: center; }
    .stat-item { padding: 0 16px; }
    .stat-value { font-size: clamp(2.75rem, 5.5vw, 4rem); font-weight: 900; line-height: 1; margin-bottom: 10px; background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-label { color: var(--text-muted); font-size: 1.05rem; font-weight: 600; }

    /* CTA Section */
    .cta-section { padding: 120px 0; }
    .cta-card { background: linear-gradient(145deg, var(--primary) 0%, #1d4ed8 50%, #1e3a8a 100%); border-radius: var(--radius); padding: 80px 50px; text-align: center; color: #fff; position: relative; overflow: hidden; box-shadow: var(--shadow-xl); }
    .cta-card::before { content: ''; position: absolute; top: -80%; right: -80%; width: 180%; height: 180%; background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 65%); animation: pulse 8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
    .cta-card::after { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 36v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 6V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); opacity: 0.5; }
    .cta-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
    .cta-card h2 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 16px; letter-spacing: -0.02em; }
    .cta-card p { font-size: 1.2rem; opacity: 0.95; margin-bottom: 32px; font-weight: 400; line-height: 1.7; }
    .cta-card .btn { background: #fff; color: var(--primary); box-shadow: 0 8px 25px rgba(0,0,0,0.15); padding: 18px 44px; font-size: 1.1rem; }
    .cta-card .btn:hover { background: #f8fafc; transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0,0,0,0.2); }

    /* Footer */
    footer { background: #0f172a; color: #94a3b8; padding: 80px 0 32px; margin-top: 80px; }
    .footer-grid { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 48px; margin-bottom: 64px; }
    .footer-brand p { color: #64748b; margin-top: 24px; line-height: 1.85; max-width: 340px; font-weight: 400; }
    .footer-col h4 { color: #fff; font-size: 0.85rem; font-weight: 700; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.08em; }
    .footer-col a { display: block; color: #94a3b8; margin-bottom: 14px; transition: color 0.2s; font-size: 0.95rem; font-weight: 400; }
