<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة — رَشّح</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preload" as="image" href="/rasheh-logo.png">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-light: #dbeafe;
      --primary-hover: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans Arabic", sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    header { background: rgba(255,255,255,0.9); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--border); padding: 16px 0; position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .logo img { width: 145px; height: 64px; object-fit: contain; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .user-email { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); transform: translateY(-1px); }
    .btn-danger { background: #fef2f2; color: #dc2626; }
    .btn-danger:hover { background: #fee2e2; }

    .container { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }
    .page-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 32px; letter-spacing: -0.02em; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
    .stat-label { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 10px; font-weight: 500; }
    .stat-value { font-size: 2.5rem; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -0.02em; }
    .stat-value.primary { background: linear-gradient(135deg, var(--primary), #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-value.warning { color: #f59e0b; }
    .stat-value.success { color: #22c55e; }

    /* Table */
    .section-title { font-size: 1.125rem; font-weight: 700; margin-bottom: 20px; }
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px 20px; text-align: right; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; font-weight: 600; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .badge { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-approved { background: #dcfce7; color: #166534; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }
    .badge-in_review { background: #e0e7ff; color: #3730a3; }

    /* Login Screen */
    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(180deg, var(--bg) 0%, #fff 100%); }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 56px 48px; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); }
    .login-logo { display: flex; justify-content: center; margin-bottom: 40px; }
    .login-logo img { width: 140px; height: 62px; object-fit: contain; }
    .login-title { text-align: center; font-size: 1.75rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; }
    .login-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 40px; font-size: 1rem; }
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 8px; color: var(--text); }
    .form-input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; background: var(--bg); }
    .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); background: #fff; }
    .login-btn { width: 100%; padding: 16px; font-size: 1rem; font-weight: 600; border-radius: 10px; }
    .login-error { background: #fef2f2; color: #dc2626; padding: 14px 16px; border-radius: 10px; margin-bottom: 24px; font-size: 0.9rem; display: none; border: 1px solid #fecaca; }
    .login-error.show { display: block; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 24px 16px; }
      .login-card { padding: 40px 24px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .stat-value { font-size: 2rem; }
      th, td { padding: 12px 14px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <header class="hidden" id="adminHeader">
    <div class="header-inner">
      <a href="/admin.html" class="logo" aria-label="رَشّح - لوحة الإدارة">
        <img src="/rasheh-logo.png" alt="" width="145" height="64">
      </a>
      <div class="header-right">
        <span class="user-email" id="adminEmail"></span>
        <button class="btn btn-danger" id="logoutBtn" type="button">خروج</button>
      </div>
    </div>
  </header>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen" role="main">
    <div class="login-card">
      <div class="login-logo">
        <img src="/rasheh-logo.png" alt="رَشّح" width="140" height="62">
      </div>
      <h1 class="login-title">لوحة الإدارة</h1>
      <p class="login-subtitle">سجل دخولك للوصول إلى لوحة التحكم</p>
      <div class="login-error" id="loginError" role="alert"></div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <input type="email" class="form-input" id="email" name="email" required autocomplete="email" placeholder="admin@company.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور</label>
          <input type="password" class="form-input" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary login-btn" id="loginBtn">دخول</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Content -->
  <main class="container hidden" id="dashboardContent" role="main">
    <h1 class="page-title">لوحة الإدارة</h1>

    <section aria-labelledby="stats-title">
      <h2 id="stats-title" class="sr-only">إحصائيات</h2>
      <div class="stats-grid">
        <article class="stat-card"><div class="stat-label">إجمالي الشركات</div><div class="stat-value primary" id="totalClients">—</div></article>
        <article class="stat-card"><div class="stat-label">إجمالي الطلبات</div><div class="stat-value" id="totalRequests">—</div></article>
        <article class="stat-card"><div class="stat-label">قيد المراجعة</div><div class="stat-value warning" id="pendingRequests">—</div></article>
        <article class="stat-card"><div class="stat-label">مقبولة</div><div class="stat-value success" id="approvedRequests">—</div></article>
      </div>
    </section>

    <section aria-labelledby="requests-title">
      <h2 id="requests-title" class="section-title">طلبات السير الذاتية</h2>
      <div class="table-wrap">
        <table id="requestsTable">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>البريد الإلكتروني</th>
              <th>المدينة</th>
              <th>سنوات الخبرة</th>
              <th>الحالة</th>
              <th>تاريخ الطلب</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = '/api';
    let authToken = localStorage.getItem('rasheh_token') || null;

    function showError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideError() {
      const el = document.getElementById('loginError');
      el.classList.remove('show');
    }

    async function apiFetch(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      if (authToken) headers.Authorization = `Bearer ${authToken}`;
      const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
      if (res.status === 401) {
        authToken = null;
        localStorage.removeItem('rasheh_token');
        showLogin();
        return null;
      }
      return res;
    }

    async function apiJson(path, options = {}) {
      const res = await apiFetch(path, options);
      if (!res) return null;
      const text = await res.text();
      try { return JSON.parse(text); }
      catch (e) {
        console.error('API non-JSON:', path, text.slice(0, 200));
        throw new Error('استجابة غير صالحة');
      }
    }

    function showLogin() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('adminHeader').classList.add('hidden');
      document.getElementById('dashboardContent').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminHeader').classList.remove('hidden');
      document.getElementById('dashboardContent').classList.remove('hidden');
    }

    async function loadDashboard() {
      try {
        const me = await apiJson('/me');
        if (!me?.user) return showLogin();
        document.getElementById('adminEmail').textContent = me.user.email;

        const stats = await apiJson('/admin/stats');
        if (!stats?.stats) return;
        const s = stats.stats;
        document.getElementById('totalClients').textContent = s.totalClients || 0;
        document.getElementById('totalRequests').textContent = s.totalRequests || 0;
        document.getElementById('pendingRequests').textContent = s.pendingRequests || 0;
        document.getElementById('approvedRequests').textContent = s.approvedRequests || 0;

        const reqs = await apiJson('/admin/requests');
        if (!reqs?.requests) return;
        const tbody = document.querySelector('#requestsTable tbody');
        tbody.innerHTML = reqs.requests.map(r => `
          <tr>
            <td>${r.full_name}</td>
            <td>${r.email}</td>
            <td>${r.city || '—'}</td>
            <td>${r.experience_years || 0}</td>
            <td><span class="badge badge-${r.status}">${r.status}</span></td>
            <td>${new Date(r.created_at).toLocaleDateString('ar-EG')}</td>
          </tr>
        `).join('');
      } catch (e) {
        console.error('Dashboard load error:', e);
        showError('فشل تحميل البيانات. تأكد من تسجيل الدخول.');
        showLogin();
      }
    }

    // Login Form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';

      try {
        // Use Supabase Auth directly
        const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
        const ANON_KEY = 'YOUR_ANON_KEY';
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: ANON_KEY },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.access_token) {
          authToken = data.access_token;
          localStorage.setItem('rasheh_token', authToken);
          showDashboard();
          loadDashboard();
        } else {
          showError(data.error_description || 'بريد أو كلمة مرور غير صحيحة');
        }
      } catch (err) {
        showError('حدث خطأ في الاتصال بالخادم');
      } finally {
        btn.disabled = false;
        btn.textContent = 'دخول';
      }
    });

    // Logout
    document.getElementById('logoutBtn').onclick = () => {
      authToken = null;
      localStorage.removeItem('rasheh_token');
      showLogin();
    };

    // Init
    if (authToken) {
      showDashboard();
      loadDashboard();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
