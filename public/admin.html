<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — رَشّح</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#3b82f6;--primary-light:#dbeafe;--primary-hover:#2563eb;--bg:#f8fafc;--surface:#ffffff;--text:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--radius:16px;--shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);--shadow-lg:0 10px 25px -5px rgba(15,23,42,.08);--shadow-xl:0 20px 40px -12px rgba(15,23,42,.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:50}
.header-inner{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}
.logo img{width:130px;height:58px;object-fit:contain}
.header-right{display:flex;align-items:center;gap:14px}
.user-email{color:var(--text-muted);font-size:.9rem;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;border:none;transition:.2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.3)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{background:#fef2f2;color:#dc2626}
.btn-danger:hover{background:#fee2e2}
.btn-success{background:#f0fdf4;color:#16a34a}
.btn-success:hover{background:#dcfce7}
.btn-sm{padding:7px 14px;font-size:.82rem}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.container{max-width:1400px;margin:0 auto;padding:32px 24px}
.page-title{font-size:1.6rem;font-weight:800;margin-bottom:6px}
.page-sub{color:var(--text-muted);margin-bottom:28px}
.tabs{display:flex;gap:4px;margin-bottom:28px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:12px 20px;font-weight:700;font-size:.92rem;color:var(--text-muted);background:none;border:none;cursor:pointer;position:relative;white-space:nowrap;font-family:inherit}
.tab::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--primary);border-radius:3px 3px 0 0;transform:scaleX(0);transition:.2s}
.tab.active{color:var(--primary)}
.tab.active::after{transform:scaleX(1)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.stat-label{font-size:.82rem;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.stat-value{font-size:2rem;font-weight:800}
.stat-value.primary{background:linear-gradient(135deg,var(--primary),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.warning{color:#f59e0b}
.stat-value.success{color:#22c55e}
.section-title{font-size:1.1rem;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.card-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:24px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:14px 16px;text-align:right;border-bottom:1px solid var(--border);font-size:.88rem}
th{background:#f8fafc;font-weight:700;color:var(--text-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.badge{display:inline-flex;padding:5px 12px;border-radius:999px;font-size:.72rem;font-weight:700}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-approved,.badge-completed,.badge-active{background:#dcfce7;color:#166534}
.badge-rejected,.badge-failed{background:#fee2e2;color:#991b1b}
.badge-in_review{background:#e0e7ff;color:#3730a3}
.badge-published{background:#dcfce7;color:#166534}
.badge-draft{background:#f1f5f9;color:#475569}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:.85rem;font-weight:700;margin-bottom:8px}
.form-input,.form-textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:.95rem;font-family:inherit;background:var(--bg);transition:.2s}
.form-textarea{resize:vertical;min-height:100px}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);background:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.checkbox-row input{width:18px;height:18px}
.action-btns{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:.2s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn.danger:hover{border-color:#dc2626;color:#dc2626}
.list-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:start;gap:16px}
.list-item-content{flex:1}
.list-item-title{font-weight:700;margin-bottom:4px}
.list-item-sub{color:var(--text-muted);font-size:.85rem}
.plans-admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.plan-edit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.plan-edit-card h4{font-weight:800;margin-bottom:14px;font-size:1rem}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,var(--bg),#fff)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:48px 40px;width:100%;max-width:420px;box-shadow:var(--shadow-xl)}
.login-logo{display:flex;justify-content:center;margin-bottom:32px}
.login-logo img{width:130px;height:58px;object-fit:contain}
.login-title{text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:6px}
.login-sub{text-align:center;color:var(--text-muted);margin-bottom:32px}
.login-btn{width:100%;padding:15px;font-size:1rem;border-radius:12px}
.login-error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px 14px;border-radius:10px;margin-bottom:20px;font-size:.88rem;display:none}
.login-error.show{display:block}
.hidden{display:none!important}
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 22px;box-shadow:var(--shadow-xl);z-index:200;transform:translateY(120px);opacity:0;transition:.4s;min-width:280px;max-width:400px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:4px solid #22c55e}
.toast.error{border-left:4px solid #ef4444}
.toast.info{border-left:4px solid var(--primary)}
.empty-note{color:var(--text-muted);text-align:center;padding:24px;font-size:.9rem}
@media (max-width:768px){.form-row,.form-row-3,.plans-admin-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<a href="/" class="btn btn-outline btn-sm">الموقع</a>
<button class="btn btn-danger btn-sm" id="logoutBtn">خروج</button>
