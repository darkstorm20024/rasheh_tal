<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رَشّح | Rasheh Talent</title><style>body{font-family:Arial;background:#081224;color:#fff;max-width:760px;margin:auto;padding:32px}input,button{padding:12px;margin:5px;width:100%;box-sizing:border-box;border-radius:9px;border:1px solid #30415f}button{background:#f5ae18;border:0;font-weight:bold;cursor:pointer}.card{background:#101d34;padding:22px;border-radius:16px;margin:15px 0}.hidden{display:none}#msg{padding:10px;color:#ffd47a;white-space:pre-wrap}.candidate{border-top:1px solid #30415f;padding:12px 0}small{color:#aab8d0}</style><h1>رَشّح <small>RASHEH TALENT</small></h1><div id="auth" class="card"><button onclick="show('register')">حساب جديد — 2 CV مجانية</button><button onclick="show('login')">تسجيل الدخول</button><div id="msg"></div><div id="register" class="hidden"><input id="company" placeholder="اسم الشركة"><input id="contact" placeholder="اسم مسؤول التوظيف"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="phone" placeholder="الهاتف"><input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><button onclick="registerUser()">إنشاء الحساب</button></div><div id="login" class="hidden"><input id="lemail" type="email" placeholder="البريد الإلكتروني"><input id="lpassword" type="password" placeholder="كلمة المرور"><button onclick="loginUser()">دخول</button></div></div><div id="app" class="hidden"><div class="card">مرحباً <b id="who"></b> — رصيدك <b id="credit"></b> CV <button onclick="logout()">خروج</button></div><div class="card"><h2>بحث المرشحين</h2><input id="job" placeholder="المسمى الوظيفي"><input id="city" placeholder="المدينة (اختياري)"><input id="exp" type="number" placeholder="أقل سنوات خبرة"><button onclick="search()">بحث</button><div id="results"></div></div></div><script>let token=localStorage.rtoken||'';function show(x){register.className='hidden';login.className='hidden';document.getElementById(x).className=''}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.detail||'فشل الطلب');return d}function message(x){msg.textContent=x}async function registerUser(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({company_name:company.value,contact_name:contact.value,email:email.value,phone:phone.value,password:password.value})});message(d.message);show('login');lemail.value=email.value}catch(e){message(e.message)}}async function loginUser(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:lemail.value,password:lpassword.value})});token=d.access_token;localStorage.rtoken=token;start(d.user)}catch(e){message(e.message)}}function start(u){auth.className='hidden';app.className='';who.textContent=u.company_name;credit.textContent=u.credits_balance}function logout(){localStorage.removeItem('rtoken');location.reload()}async function search(){try{let d=await api('/api/search',{method:'POST',headers:{Authorization:'Bearer '+token},body:JSON.stringify({job_title:job.value,city:city.value,min_experience:+exp.value||0})});results.innerHTML='<h3>'+d.total+' نتيجة</h3>'+d.candidates.map(c=>'<div class="candidate"><b>'+c.full_name+'</b><br>'+ (c.job_title||'')+' — '+(c.city||'')+' — '+(c.years_of_experience||0)+' سنوات<br><button onclick="unlock(\''+c.id+'\')">فتح بيانات التواصل (1 CV)</button></div>').join('')}catch(e){results.textContent=e.message}}async function unlock(id){try{let d=await api('/api/unlock',{method:'POST',headers:{Authorization:'Bearer '+token},body:JSON.stringify({candidate_id:id})});if(!d.success)return alert(d.message);credit.textContent=d.new_balance;alert('الهاتف: '+(d.candidate.phone||'غير متوفر')+'\nالبريد: '+(d.candidate.email||'غير متوفر')+'\nCV: '+(d.candidate.resume_url||'غير متوفر'))}catch(e){alert(e.message)}}if(token){api('/api/me',{headers:{Authorization:'Bearer '+token}}).then(d=>start(d.user)).catch(logout)}</script></html>
