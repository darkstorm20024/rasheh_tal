<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رَشّح — منصة التوظيف الذكية</title>
<link rel="icon" href="/favicon.png">
<link rel="preload" as="image" href="/rasheh-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#3b82f6;--primary-light:#dbeafe;--primary-hover:#2563eb;--bg:#f8fafc;--surface:#ffffff;--text:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--radius:16px;--shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);--shadow-lg:0 10px 25px -5px rgba(15,23,42,.08),0 8px 10px -6px rgba(15,23,42,.04);--shadow-xl:0 20px 40px -12px rgba(15,23,42,.15)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;line-height:1.7;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
.container{max-width:1280px;margin:0 auto;padding:0 24px}
header{background:rgba(255,255,255,.95);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:50}
.header-inner{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo img{width:145px;height:64px;object-fit:contain}
nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-link{padding:10px 18px;border-radius:10px;font-weight:600;color:var(--text-muted);transition:.2s;font-size:.95rem;background:none;border:none;cursor:pointer;font-family:inherit}
.nav-link:hover{background:var(--primary-light);color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 28px;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;transition:.2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.3)}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text)}
.btn-ghost:hover{background:#f1f5f9;color:var(--primary)}
.btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-lg{padding:16px 36px;font-size:1.05rem}
.hero{padding:100px 0 120px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60%;left:-60%;width:220%;height:220%;background:radial-gradient(ellipse at center,var(--primary-light) 0%,transparent 70%);opacity:.6;pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 20px;margin-bottom:24px;font-size:.9rem;font-weight:600;color:var(--primary);box-shadow:var(--shadow)}
.hero-badge svg{width:16px;height:16px}
.hero h1{font-size:clamp(2.25rem,5.5vw,4rem);font-weight:900;line-height:1.15;margin-bottom:24px;max-width:960px;margin-inline:auto;letter-spacing:-.02em}
.hero h1 .hl{background:linear-gradient(135deg,var(--primary),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:clamp(1.1rem,2.2vw,1.4rem);color:var(--text-muted);margin-bottom:40px;max-width:720px;margin-inline:auto}
.hero-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.features{padding:90px 0}
.features-header{text-align:center;margin-bottom:56px}
.section-tag{display:inline-block;font-size:.85rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px}
.features-header h2{font-size:clamp(1.85rem,3.5vw,2.5rem);font-weight:900;margin-bottom:16px}
.features-header p{color:var(--text-muted);font-size:1.15rem;max-width:640px;margin:0 auto}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px 30px;box-shadow:var(--shadow);transition:.35s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),#60a5fa);transform:scaleX(0);transition:.35s}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-xl)}
.card:hover::before{transform:scaleX(1)}
.card-icon{width:54px;height:54px;background:var(--primary-light);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:var(--primary);transition:.35s}
.card:hover .card-icon{background:var(--primary);color:#fff}
.card h3{font-size:1.15rem;font-weight:800;margin-bottom:10px}
.card p{color:var(--text-muted);font-size:.95rem;line-height:1.8}
.testimonials{padding:90px 0;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:48px}
.testi-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.testi-stars{color:#f59e0b;margin-bottom:12px;font-size:.9rem}
.testi-content{color:var(--text);font-size:.95rem;line-height:1.8;margin-bottom:16px}
.testi-author{display:flex;align-items:center;gap:12px}
.testi-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem}
.testi-name{font-weight:700;font-size:.9rem}
.testi-role{color:var(--text-muted);font-size:.8rem}
.articles{padding:90px 0}
.articles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:48px}
.article-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.3s}
.article-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.article-cover{width:100%;height:170px;object-fit:cover;background:var(--primary-light)}
.article-body{padding:22px}
.article-tag{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:12px}
.article-title{font-size:1.05rem;font-weight:800;margin-bottom:8px;line-height:1.5}
.article-excerpt{color:var(--text-muted);font-size:.9rem;line-height:1.7}
.stats-bar{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:64px 0}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px;text-align:center}
.stat-value{font-size:clamp(2.5rem,5vw,3.5rem);font-weight:900;background:linear-gradient(135deg,var(--primary),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.stat-label{color:var(--text-muted);font-weight:600}
.cta-section{padding:100px 0}
.cta-card{background:linear-gradient(145deg,var(--primary) 0%,#1d4ed8 50%,#1e3a8a 100%);border-radius:var(--radius);padding:70px 40px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-xl)}
.cta-content{position:relative;z-index:1;max-width:680px;margin:0 auto}
.cta-card h2{font-size:clamp(1.85rem,4vw,2.75rem);font-weight:900;margin-bottom:16px}
.cta-card p{font-size:1.15rem;opacity:.95;margin-bottom:28px}
.cta-card .btn{background:#fff;color:var(--primary);padding:16px 40px}
footer{background:#0f172a;color:#94a3b8;padding:70px 0 30px;margin-top:60px}
.footer-top{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:40px;margin-bottom:48px}
.footer-brand p{color:#64748b;margin-top:20px;line-height:1.8;max-width:320px;font-size:.92rem}
.footer-col h4{color:#fff;font-size:.85rem;font-weight:700;margin-bottom:20px;text-transform:uppercase;letter-spacing:.08em}
.footer-col a{display:block;color:#94a3b8;margin-bottom:12px;font-size:.92rem;transition:.2s}
.footer-col a:hover{color:#fff}
.socials{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.socials a{width:42px;height:42px;border-radius:11px;background:#1e293b;display:flex;align-items:center;justify-content:center;color:#94a3b8;transition:.2s}
.socials a:hover{background:var(--primary);color:#fff}
.payment-box{background:#1e293b;border-radius:12px;padding:18px 20px}
.payment-box h5{color:#fff;font-size:.82rem;font-weight:700;margin-bottom:12px}
.payment-row{display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0;border-bottom:1px solid #29374a}
.payment-row:last-child{border-bottom:none}
.payment-row span:first-child{color:#64748b}
.payment-row span:last-child{color:#e2e8f0;font-weight:600;direction:ltr;text-align:left}
.footer-bottom{border-top:1px solid #1e293b;padding-top:28px;text-align:center;font-size:.9rem;color:#64748b}
@media (max-width:900px){.footer-top{grid-template-columns:1fr 1fr;gap:32px}}
@media (max-width:560px){.footer-top{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.85);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.35s;padding:24px;overflow-y:auto}
.modal.open{opacity:1;visibility:visible}
.modal-content{background:var(--surface);border-radius:var(--radius);max-width:900px;width:100%;max-height:90vh;overflow:auto;transform:scale(.92);transition:.35s;box-shadow:0 25px 60px -12px rgba(15,23,42,.3)}
.modal.open .modal-content{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-header h3{font-size:1.15rem;font-weight:800}
.modal-close{background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--text-muted);width:40px;height:40px;border-radius:10px;display:flex;align-items:ce
