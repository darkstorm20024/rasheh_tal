<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="رَشّح — منصة التوظيف الذكية للشركات والمرشحين.">
  <title>رَشّح — منصة التوظيف الذكية</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #3b82f6;
      --blue-dark: #2563eb;
      --blue-light: #dbeafe;
      --bg: #f8fafc;
      --white: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --dark: #0f172a;
      --radius: 16px;
      --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-lg: 0 18px 42px rgba(15, 23, 42, .14);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Cairo, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    button, input { font-family: inherit; }
    .container { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .hidden { display: none !important; }

    /* Header */
    .header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
    .header-inner { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { font-size: 1.55rem; color: var(--blue); font-weight: 900; }
    .logo img { width: 138px; height: 54px; object-fit: contain; display: block; }
    .nav { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .nav-link { display: inline-block; padding: 9px 12px; border-radius: 9px; color: var(--muted); font-size: .89rem; font-weight: 700; }
    .nav-link:hover { color: var(--blue); background: var(--blue-light); }
    #authButtons { display: flex; gap: 8px; align-items: center; }

    /* Buttons */
    .btn { border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 11px; padding: 11px 18px; font-size: .88rem; font-weight: 800; transition: .2s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--blue); color: white; box-shadow: 0 6px 16px rgba(59,130,246,.26); }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-outline { background: white; border: 1.5px solid var(--blue); color: var(--blue); }
    .btn-outline:hover { background: var(--blue); color: white; }
    .btn-ghost { background: transparent; color: var(--text); }
    .btn-ghost:hover { background: #f1f5f9; color: var(--blue); }
    .btn-large { padding: 15px 27px; font-size: 1rem; }
    .btn-small { padding: 8px 12px; font-size: .8rem; }

    /* Hero */
    .hero { min-height: 570px; display: flex; align-items: center; text-align: center; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 2%, #dbeafe 0, transparent 48%); }
    .hero::before { content: ''; position: absolute; top: -260px; right: -180px; width: 560px; height: 560px; border-radius: 50%; background: rgba(59,130,246,.08); }
    .hero::after { content: ''; position: absolute; bottom: -260px; left: -150px; width: 450px; height: 450px; border-radius: 50%; background: rgba(96,165,250,.08); }
    .hero-content { position: relative; z-index: 1; width: 100%; padding: 80px 0; }
    .eyebrow { display: inline-block; margin-bottom: 18px; padding: 7px 15px; border: 1px solid #bfdbfe; border-radius: 999px; background: #eff6ff; color: var(--blue); font-size: .8rem; font-weight: 800; }
    .hero h1 { max-width: 930px; margin: 0 auto; font-size: clamp(2rem, 5vw, 4rem); font-weight: 900; line-height: 1.22; }
    .hero h1 .blue { color: var(--blue); }
    .hero p { max-width: 720px; margin: 20px auto 32px; color: var(--muted); font-size: 1.1rem; }
    .hero-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

    /* Sections */
    section { padding: 78px 0; }
    .section-head { max-width: 710px; margin: 0 auto 40px; text-align: center; }
    .section-head h2 { margin: 0 0 10px; font-size: clamp(1.65rem, 3vw, 2.35rem); line-height: 1.35; font-weight: 900; }
    .section-head p { margin: 0; color: var(--muted); }

    /* Features */
    .features-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .feature-card { padding: 27px 24px; border: 1px solid var(--border); border-radius: var(--radius); background: white; box-shadow: var(--shadow); }
    .feature-icon { width: 52px; height: 52px; display: grid; place-items: center; margin-bottom: 16px; border-radius: 14px; background: var(--blue-light); color: var(--blue); font-size: 1.38rem; }
    .feature-card h3 { margin: 0 0 8px; font-size: 1.02rem; font-weight: 900; }
    .feature-card p { margin: 0; color: var(--muted); font-size: .88rem; }

    /* Stats */
    .stats { padding: 52px 0; background: white; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; text-align: center; }
    .stat-number { display: block; color: var(--blue); font-size: clamp(2rem,4vw,2.9rem); font-weight: 900; line-height: 1.2; }
    .stat-label { color: var(--muted); font-size: .86rem; font-weight: 700; }

    /* Cards */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .article-card, .testimonial-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: white; box-shadow: var(--shadow); }
    .article-cover { height: 150px; background: linear-gradient(135deg,#dbeafe,#bfdbfe); }
    .article-cover img { width: 100%; height: 150px; object-fit: cover; display: block; }
    .article-content { padding: 19px; }
    .tag { display: inline-block; padding: 3px 10px; margin-bottom: 8px; border-radius: 999px; background: var(--blue-light); color: var(--blue); font-size: .7rem; font-weight: 800; }
    .article-content h3 { margin: 0 0 7px; font-size: 1rem; line-height: 1.55; font-weight: 900; }
    .article-content p { margin: 0; color: var(--muted); font-size: .84rem; }
    .testimonials { background: white; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .testimonial-card { padding: 23px; background: var(--bg); }
    .stars { color: #f59e0b; margin-bottom: 10px; letter-spacing: 2px; }
    .testimonial-text { min-height: 72px; margin: 0 0 17px; font-size: .9rem; }
    .author { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--blue-light); color: var(--blue); font-weight: 900; }
    .author strong { display: block; font-size: .85rem; }.author span { color: var(--muted); font-size: .75rem; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 25px; }

    /* CTA */
    .cta { padding: 80px 0; }
    .cta-card { padding: 60px 24px; border-radius: 22px; text-align: center; color: white; background: linear-gradient(135deg,#2563eb,#1e3a8a); box-shadow: var(--shadow-lg); }
    .cta-card h2 { margin: 0; font-size: clamp(1.65rem,3vw,2.4rem); font-weight: 900; }.cta-card p { max-width: 630px; margin: 12px auto 24px; opacity: .92; }.cta-card .btn { background: white; color: var(--blue); }

    /* Footer */
    footer { padding: 60px 0 24px; background: var(--dark); color: #94a3b8; }
    .footer-grid { display: grid; grid-template-columns: 1.45fr 1fr 1fr 1.22fr; gap: 30px; }
    .footer-logo img { width: 138px; height: 57px; object-fit: contain; display: block; }.footer-desc { max-width: 300px; margin: 15px 0 0; font-size: .85rem; }.footer-title { margin: 8px 0 15px; color: white; font-size: .9rem; font-weight: 800; }.footer-links a { display: block; margin: 9px 0; font-size: .85rem; }.footer-links a:hover { color: white; }
    .socials { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 17px; }.social { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 10px; background: #1e293b; color: #dbeafe; font-weight: 900; }.social:hover { background: var(--blue); }
    .bank { padding: 15px; border-radius: 12px; background: #1e293b; font-size: .78rem; }.bank h5 { margin: 0 0 7px; color: white; font-size: .82rem; }.bank-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #334155; }.bank-row:last-child { border: 0; }.bank-row span:last-child { color: white; direction: ltr; overflow-wrap: anywhere; text-align: left; }.copyright { margin-top: 35px; padding-top: 18px; border-top: 1px solid #1e293b; color: #64748b; text-align: center; font-size: .79rem; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; z-index: 100; padding: 18px; overflow-y: auto; background: rgba(15,23,42,.74); }.modal.open { display: flex; align-items: center; justify-content: center; }.modal-box { width: min(100%, 500px); max-height: calc(100vh - 36px); overflow-y: auto; border-radius: 18px; background: white; box-shadow: var(--shadow-lg); }.modal-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; background: white; border-bottom: 1px solid var(--border); }.modal-head h3 { margin: 0; font-size: 1.1rem; font-weight: 900; }.close { border: 0; background: transparent; color: var(--muted); font-size: 1.75rem; cursor: pointer; }.modal-body { padding: 23px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 20px; border-bottom: 1px solid var(--border); }.tab { padding: 12px; border: 0; border-bottom: 3px solid transparent; background: white; color: var(--muted); font-weight: 900; cursor: pointer; }.tab.active { color: var(--blue); border-bottom-color: var(--blue); }.form { display: none; }.form.active { display: block; }.fiel
