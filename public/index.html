<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رَشّح — منصة التوظيف الذكية</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.6; color: #1f2937; background: #fafafa; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .rasheh-logo-image { width: 145px; height: 64px; object-fit: contain; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 24px; position: sticky; top: 0; z-index: 50; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    nav a { margin-left: 24px; text-decoration: none; color: #374151; font-weight: 500; }
    nav a:hover { color: #111827; }
    main { padding: 60px 24px; }
    .hero { text-align: center; max-width: 800px; margin: 0 auto; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; color: #111827; margin-bottom: 16px; line-height: 1.2; }
    .hero p { font-size: 1.25rem; color: #4b5563; margin-bottom: 32px; }
    .btn { display: inline-block; background: #2563eb; color: #fff; padding: 14px 32px; border-radius: 8px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 60px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
    .card h3 { font-size: 1.125rem; font-weight: 700; margin-bottom: 8px; color: #111827; }
    .card p { color: #6b7280; font-size: 0.95rem; }
    footer { background: #111827; color: #9ca3af; padding: 40px 24px; text-align: center; margin-top: 80px; }
    footer a { color: #fff; margin: 0 12px; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="brand" data-rasheh-logo></div>
      <nav>
        <a href="#features">المميزات</a>
        <a href="/admin.html">لوحة الإدارة</a>
        <a href="#" id="loginBtn">تسجيل الدخول</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="hero">
      <h1 id="heroTitle">جاري التحميل…</h1>
      <p id="heroText">جاري التحميل…</p>
      <a class="btn" href="#contact">ابدأ الآن</a>
    </section>

    <section class="features" id="features">
      <div class="card">
        <h3>مطابقة ذكية</h3>
        <p>محرك بحث بالخبرة والمهارات والمدينة في ثوانٍ.</p>
      </div>
      <div class="card">
        <h3>حماية البيانات</h3>
        <p>خصوصية كاملة لبيانات المرشحين والشركات.</p>
      </div>
      <div class="card">
        <h3>تقارير فورية</h3>
        <p>إحصائيات ولوحة تحكم لحظية لقرارات أسرع.</p>
      </div>
    </section>
  </main>

  <footer>
    <div id="socials"></div>
    <p>© 2025 رَشّح. جميع الحقوق محفوظة.</p>
  </footer>

  <script src="/rasheh-logo-integration.js"></script>
  <script>
    async function loadContent() {
      try {
        const res = await fetch('/api/cms/content');
        const { content } = await res.json();

        document.getElementById('heroTitle').textContent = content.hero_title;
        document.getElementById('heroText').textContent = content.hero_text;

        const socials = document.getElementById('socials');
        const links = content.socials || {};
        Object.entries(links).forEach(([key, url]) => {
          if (url) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = key.charAt(0).toUpperCase() + key.slice(1);
            socials.appendChild(a);
          }
        });
      } catch (e) {
        console.error('Failed to load content:', e);
      }
    }
    loadContent();
  </script>
</body>
</html>
