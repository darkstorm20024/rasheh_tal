<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>رَشّح — منصة التوظيف الذكية</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#3b82f6;--blue2:#2563eb;--light:#dbeafe;--bg:#f8fafc;--white:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--dark:#0f172a;--radius:16px;--shadow:0 1px 3px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);--shadow-lg:0 18px 38px rgba(15,23,42,.12)}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:Cairo,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
    a{text-decoration:none;color:inherit}
    button,input{font-family:inherit}
    .container{width:min(1180px,calc(100% - 40px));margin:auto}
    .site-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .header-inner{height:82px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .logo img{width:140px;height:58px;object-fit:contain}
    .nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    .nav a,.nav button{border:0;background:transparent;color:var(--muted);font-size:.92rem;font-weight:700;padding:10px 13px;border-radius:10px;cursor:pointer}
    .nav a:hover,.nav button:hover{background:var(--light);color:var(--blue)}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:11px;padding:12px 20px;font-weight:800;cursor:pointer;transition:.2s}
    .btn-primary{background:var(--blue);color:#fff;box-shadow:0 7px 18px rgba(59,130,246,.24)}
    .btn-primary:hover{background:var(--blue2);transform:translateY(-1px)}
    .btn-outline{background:#fff;border:1px solid var(--blue);color:var(--blue)}
    .btn-outline:hover{background:var(--blue);color:#fff}
    .btn-ghost{background:transparent;color:var(--text)}
    .hero{padding:94px 0 105px;text-align:center;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 10%,#dbeafe 0,transparent 46%)}
    .hero:before{content:"";position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(59,130,246,.06);top:-260px;right:-190px}
    .hero>*{position:relative}
    .eyebrow{display:inline-block;color:var(--blue);background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:7px 16px;font-size:.82rem;font-weight:800;margin-bottom:19px}
    h1{font-size:clamp(2rem,5vw,4rem);font-weight:900;line-height:1.22;max-width:920px;margin:auto}
    h1 span{color:var(--blue)}
    .hero p{max-width:710px;margin:22px auto 34px;font-size:1.12rem;color:var(--muted)}
    .hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    section{padding:84px 0}
    .section-head{text-align:center;margin-bottom:44px}
    .section-head .eyebrow{margin-bottom:10px}
    .section-head h2{font-size:clamp(1.7rem,3vw,2.35rem);font-weight:900;margin-bottom:10px}
    .section-head p{color:var(--muted)}
    .features-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    .feature-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:27px;box-shadow:var(--shadow)}
    .feature-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--light);color:var(--blue);font-size:1.45rem;margin-bottom:16px}
    .feature-card h3{font-size:1.04rem;font-weight:900;margin-bottom:8px}
    .feature-card p{color:var(--muted);font-size:.9rem}
    .stats{background:#fff;border-block:1px solid var(--border);padding:55px 0}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:20px}
    .stat strong{display:block;color:var(--blue);font-size:2.35rem;font-weight:900;line-height:1.2}
    .stat span{color:var(--muted);font-size:.9rem;font-weight:700}
    .cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .article-card,.testimonial{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .article-image{height:145px;background:linear-gradient(135deg,#dbeafe,#bfdbfe)}
    .article-card img{width:100%;height:145px;object-fit:cover;display:block}
    .article-body{padding:19px}
    .tag{display:inline-block;background:var(--light);color:var(--blue);border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:800;margin-bottom:8px}
    .article-body h3{font-size:1rem;font-weight:900;line-height:1.55;margin-bottom:7px}
    .article-body p{color:var(--muted);font-size:.86rem}
    .testimonials{background:#fff;border-block:1px solid var(--border)}
    .testimonial{padding:24px;background:var(--bg)}
    .stars{color:#f59e0b;font-size:1rem;margin-bottom:11px}
    .testimonial p{font-size:.92rem;margin-bottom:17px}
    .person{display:flex;align-items:center;gap:10px}
    .avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--light);color:var(--blue);font-weight:900}
    .person strong{display:block;font-size:.88rem}.person span{font-size:.77rem;color:var(--muted)}
    .cta-wrap{padding:82px 0}
    .cta{background:linear-gradient(135deg,#2563eb,#1e3a8a);color:#fff;padding:63px 28px;border-radius:22px;text-align:center;box-shadow:var(--shadow-lg)}
    .cta h2{font-size:clamp(1.7rem,3vw,2.45rem);font-weight:900}.cta p{margin:12px auto 24px;opacity:.9;max-width:620px}.cta .btn{background:#fff;color:var(--blue)}
    footer{background:var(--dark);color:#94a3b8;padding:62px 0 25px}
    .footer-grid{display:grid;grid-template-columns:1.45fr 1fr 1fr 1.2fr;gap:34px}
    .footer-logo img{width:140px;height:58px;object-fit:contain}.footer-about{font-size:.88rem;margin-top:15px;max-width:300px;color:#94a3b8}
    footer h4{font-size:.9rem;color:#fff;margin:9px 0 15px}.footer-links a{display:block;font-size:.86rem;margin:9px 0;color:#94a3b8}.footer-links a:hover{color:#fff}
    .socials{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.social{width:39px;height:39px;display:grid;place-items:center;border-radius:10px;background:#1e293b;color:#dbeafe;font-size:1rem}.social:hover{background:var(--blue)}
    .bank{background:#1e293b;padding:15px;border-radius:12px;font-size:.79rem}.bank-row{display:flex;justify-content:space-between;gap:9px;padding:6px 0;border-bottom:1px solid #334155}.bank-row:last-child{border:0}.bank-row span:last-child{color:#fff;direction:ltr;text-align:left;overflow-wrap:anywhere}
    .copyright{border-top:1px solid #1e293b;margin-top:36px;padding-top:18px;text-align:center;font-size:.8rem;color:#64748b}
    .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.72);z-index:100;padding:20px;overflow:auto}.modal.open{display:flex;justify-content:center;align-items:center}
    .modal-box{width:min(100%,500px);background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:calc(100vh - 40px);overflow-y:auto}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}.modal-head h3{font-size:1.15rem;font-weight:900}.close{border:0;background:transparent;font-size:1.7rem;color:var(--muted);cursor:pointer}
    .modal-content{padding:25px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);margin-bottom:22px}.tab{border:0;background:#fff;padding:13px;color:var(--muted);font-weight:900;cursor:pointer}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}
    .form{display:none}.form.active{display:block}.field{margin-bottom:14px}.field label{display:block;font-size:.84rem;font-weight:800;margin-bottom:6px}.field input{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:11px;padding:12px 13px;font-size:.96rem}.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--light);background:#fff}.form .btn{width:100%;margin-top:7px;padding:13px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error{display:none;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:.84rem;margin-bottom:14px}.error.show{display:block}.form-foot{text-align:center;font-size:.86rem;color:var(--muted);margin-top:18px}.form-foot a{color:var(--blue);font-weight:800}
    .toast{position:fixed;bottom:22px;right:22px;z-index:200;background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px 18px;box-shadow:var(--shadow-lg);transform:translateY(120px);opacity:0;transition:.3s;min-width:250px}.toast.show{transform:translateY(0);opacity:1}.toast.success{border-right:4px solid #22c55e}.toast.error{border-right:4px solid #ef4444}
    .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:24px}
    @media(max-width:960px){.features-grid{grid-template-columns:repeat(2,1fr)}.cards-grid{grid-template-columns:repeat(2,1fr)}.footer-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.header-inner{height:auto;padding:12px 0;align-items:flex-start}.nav{justify-content:flex-end}.nav a{display:none}.features-grid,.cards-grid,.stats-grid,.footer-grid,.form-row{grid-template-columns:1fr}.hero{padding:72px 0}.footer-grid{gap:24px}.logo img{width:115px}.nav .btn{padding:9px 11px;font-size:.78rem}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/"><img src="/rasheh-logo.png" alt="رَشّح"></a>
      <nav class="nav">
        <a href="#features">المميزات</a>
        <a href="/pricing.html">الباقات</a>
        <a href="#articles">المقالات</a>
        <div id="authButtons"></div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <span class="eyebrow">✦ منصة التوظيف الذكية</span>
        <h1 id="heroTitle">وظّف أفضل الكفاء
